  
    <div class="step-content">
      
      <div *ngIf="productType === 'voice'" class="mb-4">
        <p class="fw-bold">Choose SIM Type</p>
        <div class="d-flex gap-5">
          <label class="d-flex align-items-center gap-2">
            <input type="radio" name="sim" class="red-radio" (change)="onResType('Row')"> Row
          </label>
          <label class="d-flex align-items-center gap-2">
            <input type="radio" name="sim" class="red-radio"(change)="onResType('Pre-Activate')"> Pre-Activate
          </label>
        </div>
      </div>

      <div class="mb-4">
        <p class="fw-bold">Choose Reservation Type</p>
        <div class="d-flex gap-5">
          <label class="d-flex align-items-center gap-2">
            <input type="radio" name="res" class="red-radio" (change)="onResType('Pool Selection')"> Pool Selection
          </label>
          <label class="d-flex align-items-center gap-2">
            <input type="radio" name="res" class="red-radio" (change)="onResType('Manual Input')"> Manual Input
          </label>
        </div>
      </div>
      
    </div>
