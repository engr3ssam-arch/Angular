<div class="container">
  <div class="card m-4 shadow-lg p-4 bg-body-tertiary rounded">
    <h1 class="text-center mb-4 fw-bold text-secondary">REGISTER NOW</h1>
    
    <form [formGroup]="registerForm" (ngSubmit)="Register()">
      <div class="row">
        <div class="col-md-12 mb-3">
          <label class="form-label fw-semibold">First Name</label>
          <input type="text" class="form-control" formControlName="firstName" >
          @if (registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid) {
            <small class="text-danger">First name is required (min 3 chars)</small>
          }
        </div>

        <div class="col-md-12 mb-3">
          <label class="form-label fw-semibold">Last Name</label>
          <input type="text" class="form-control" formControlName="lastName" >
        </div>

        <div class="col-md-12 mb-3">
          <label class="form-label fw-semibold">Maiden Name</label>
          <input type="text" class="form-control" formControlName="maidenName" >
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" class="form-control" formControlName="username" >
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Email address</label>
        <input type="email" class="form-control" formControlName="email" placeholder="name@example.com">
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" formControlName="password">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Confirm Password</label>
          <input type="password" class="form-control" formControlName="rePassword">
          @if (registerForm.hasError('mismatch') && registerForm.get('rePassword')?.touched) {
            <small class="text-danger d-block">Passwords do not match!</small>
          }
        </div>
      </div>

      <button class="btn btn-primary w-100 mt-3 py-2 fw-bold" type="submit" [disabled]="registerForm.invalid">
        CREATE ACCOUNT
      </button>
    </form>
  </div>
</div>
